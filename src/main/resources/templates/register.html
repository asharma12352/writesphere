<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - WriteSphere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #f5f0eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 400px;
        }
        h1 { color: #2c2c2c; margin-bottom: 8px; font-size: 28px; }
        p.subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #444; }
        .error { color: red; margin-bottom: 12px; font-size: 14px; }
        .link { text-align: center; margin-top: 16px; font-size: 14px; }
        .link a { color: #2c2c2c; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>Join WriteSphere</h1>
    <p class="subtitle">Create your account and start writing!</p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <form method="post" action="/register">
        <input type="text" name="username" placeholder="Username" required/>
        <input type="email" name="email" placeholder="Email" required/>
        <input type="password" name="password" placeholder="Password" required/>
        <button type="submit">Create Account</button>
    </form>
    <div class="link">
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
</body>
</html>
