<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Post - WriteSphere</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: #f5f0eb; }
        .navbar {
            background: #2c2c2c;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { color: white; font-size: 24px; }
        .navbar a { color: #ccc; text-decoration: none; font-size: 14px; }
        .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .container h2 { color: #2c2c2c; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Georgia', serif;
        }
        textarea { height: 300px; resize: vertical; }
        button {
            padding: 12px 30px;
            background: #2c2c2c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #444; }
        .cancel {
            margin-left: 12px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h1>WriteSphere</h1>
    <a href="/home">← Back to Home</a>
</div>
<div class="container">
    <h2>Create New Post</h2>
    <form method="post" action="/post/create">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" placeholder="Enter your title..." required/>
        </div>
        <div class="form-group">
            <label>Type</label>
            <select name="type">
                <option value="Blog">Blog</option>
                <option value="Article">Article</option>
            </select>
        </div>
        <div class="form-group">
            <label>Content</label>
            <textarea name="content" placeholder="Write your content here..." required></textarea>
        </div>
        <button type="submit">Publish Post</button>
        <a href="/home" class="cancel">Cancel</a>
    </form>
</div>
</body>
</html>
